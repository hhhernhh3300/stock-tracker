# Render.com Blueprint — deploys the Analyst Agent to a public URL (free tier).
#
# One-click: push this repo, then on https://dashboard.render.com click
#   "New +" -> "Blueprint" -> pick your GitHub repo. Render reads this file and
#   creates BOTH services below. You get public URLs like:
#     backend : https://analyst-agent-api.onrender.com
#     frontend: https://analyst-agent-web.onrender.com   <-- open this in a browser
#
# After the first deploy, set the frontend's VITE_API_URL to the backend URL
# (see DEPLOY.md) and trigger a redeploy of the web service.
#
# NOTE: the free backend instance sleeps after ~15 min idle and cold-starts on the
# next request (first analyze may take ~30-60s). That is normal for the free tier.

services:
  # ----- Backend: FastAPI (Python web service) -----
  - type: web
    name: analyst-agent-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # Leave LLM keys UNSET to run the free rule-based engine. To enable AI,
      # add ONE of these in the Render dashboard (Environment tab) — never commit:
      #   GEMINI_API_KEY        (free tier: aistudio.google.com/app/apikey)
      #   OPENAI_COMPAT_API_KEY + OPENAI_COMPAT_BASE_URL + OPENAI_COMPAT_MODEL (e.g. Groq)
      #   OPENAI_API_KEY / ANTHROPIC_API_KEY (paid)
      - key: LLM_PROVIDER
        value: auto
      - key: ALLOW_RULES_FALLBACK
        value: "true"
      # Restrict CORS to your frontend origin. Update this to the web URL Render
      # assigns (e.g. https://analyst-agent-web.onrender.com) after first deploy.
      - key: CORS_ORIGINS
        sync: false

  # ----- Frontend: React build served as a static site -----
  - type: web
    name: analyst-agent-web
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    # SPA fallback so client routes resolve to index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Point the built frontend at the backend's public URL. After the API
      # service is created, set this to its URL, then redeploy this service.
      - key: VITE_API_URL
        sync: false
