# Render.com Blueprint — deploys the Analyst Agent to ONE public URL (free tier).
#
# This uses the single-service Dockerfile: FastAPI serves the built React app, so
# the entire site lives behind one URL (no CORS, no second service to wire up).
#
# One-click:
#   1. Push this repo to GitHub.
#   2. Go to https://dashboard.render.com -> "New +" -> "Blueprint".
#   3. Pick this repo. Render reads this file and creates the service below.
#   4. Click "Apply". After it builds, open the URL Render assigns, e.g.
#         https://analyst-agent.onrender.com
#
# Runs the FREE rule-based engine by default (no API key needed). To enable AI,
# add ONE key in the Render dashboard (Environment tab) — never commit keys:
#   GEMINI_API_KEY            free: https://aistudio.google.com/app/apikey
#   OPENAI_COMPAT_API_KEY + OPENAI_COMPAT_BASE_URL + OPENAI_COMPAT_MODEL (e.g. Groq)
#   OPENAI_API_KEY / ANTHROPIC_API_KEY   (paid)
#
# NOTE: the free instance sleeps after ~15 min idle and cold-starts on the next
# request (first analyze may take ~30-60s). That is normal for the free tier.

services:
  - type: web
    name: analyst-agent
    runtime: docker
    # Anchor all paths to this repo subfolder (the blueprint lives here too).
    rootDir: analyst-agent
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: auto
      - key: ALLOW_RULES_FALLBACK
        value: "true"
      # Same-origin app: CORS not needed, but harmless if left at default.
      - key: CORS_ORIGINS
        value: "*"
