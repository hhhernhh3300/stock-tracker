name: After-Hours Screener

on:
  schedule:
    # Backup only. GitHub's cron has been starting this 4-7 h late, so the
    # job-scheduler Worker (scheduler/) starts it on time at 5:30pm New York time
    # (1.5 h into extended trading, all year round). A late duplicate skips itself.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: after-hours
  cancel-in-progress: false

jobs:
  ah:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Skip if already refreshed this session
        id: guard
        if: github.event_name == 'schedule'
        run: python3 scripts/fresh_guard.py data/after_hours.json updated_at 12

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r scripts/requirements.txt

      - name: Run after-hours screener
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/screen.py --mode after-hours

      - name: Commit updated after_hours.json
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/after_hours.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh after-hours data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed, retrying…"
            sleep 3
          done
          echo "Could not push after retries." >&2
          exit 1
