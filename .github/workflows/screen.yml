name: Daily Screener

on:
  schedule:
    # 11:00 UTC weekdays (~7am ET, ~7pm SGT). Before US market open.
    - cron: "0 11 * * 1-5"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/universe.txt"
      - ".github/workflows/screen.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run screener
        run: python scripts/screen.py

      - name: Commit updated screener.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/screener.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh screener data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed, retrying…"
            sleep 3
          done
          echo "Could not push after retries." >&2
          exit 1
