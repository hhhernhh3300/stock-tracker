name: Daily Screener

on:
  schedule:
    # Backup only. GitHub's cron has been starting this 6-10 h late, so the
    # job-scheduler Worker (scheduler/) starts it on time at 7:00am New York time
    # via workflow_dispatch. If that run already happened, this one skips itself.
    - cron: "0 11 * * 1-5"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/universe.txt"
      - ".github/workflows/screen.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Skip if already refreshed today
        id: guard
        if: github.event_name == 'schedule'
        run: python3 scripts/fresh_guard.py data/screener.json updated_at 12

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r scripts/requirements.txt

      - name: Run screener
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/screen.py

      - name: Commit updated screener.json
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/screener.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh screener data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed, retrying…"
            sleep 3
          done
          echo "Could not push after retries." >&2
          exit 1
